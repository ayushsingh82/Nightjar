<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" role="img" aria-label="Nightjar">
  <title>Nightjar</title>
  <!-- printed on paper, stamped in ink: no gradient, no glow, square caps -->
  <rect x="0" y="0" width="24" height="24" fill="#ede9de"/>
  <rect x="1" y="1" width="22" height="22" stroke="#0a0a0a" stroke-width="2"/>
  <!-- the sun, most of the way down — one flat block of signal orange -->
  <path d="M7 18a5 5 0 0 1 10 0Z" fill="#ff4a17"/>
  <!-- the horizon it is going behind -->
  <path d="M3.5 18h17" stroke="#0a0a0a" stroke-width="2" stroke-linecap="square"/>
  <!-- the bird, still up: two mitred chevrons, so it survives at 16px -->
  <path d="M4.5 10.5 8.25 7 12 10 15.75 7 19.5 10.5" stroke="#0a0a0a" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
